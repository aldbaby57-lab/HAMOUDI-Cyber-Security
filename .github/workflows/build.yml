name: Build HAMOUDI App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Setup Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Work around purchase plugin lint crash
        shell: bash
        run: |
          if [ -f android/build.gradle ]; then
            cat >> android/build.gradle <<'EOF'

          subprojects {
              tasks.configureEach { task ->
                  if (task.path == ':in_app_purchase_android:lintVitalAnalyzeRelease') {
                      task.enabled = false
                  }
              }
          }
          EOF
          elif [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              tasks.configureEach {
                  if (path == ":in_app_purchase_android:lintVitalAnalyzeRelease") {
                      enabled = false
                  }
              }
          }
          EOF
          else
            echo "Android Gradle build file not found"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAMOUDI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
